version: "3.9"

networks:
  practice-network:
    driver: bridge

volumes:
  postgres_practice_data:

services:
  practice-db:
    image: postgres:16-alpine
    container_name: candidate_practice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: practice_user
      POSTGRES_PASSWORD: practice_password_2026
      POSTGRES_DB: interview_practice_db
    ports:
      - "5434:5432"
    volumes:
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_practice_data:/var/lib/postgresql/data
    networks:
      - practice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice_user -d interview_practice_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: candidate_practice_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://practice_user:practice_password_2026@practice-db:5432/interview_practice_db
      # Add other essential backend env variables if they aren't loaded securely from elsewhere. 
      # Usually docker-compose can use an env_file to pass the rest of the secrets.
    env_file:
      - ./backend/.env
    networks:
      - practice-network
    depends_on:
      practice-db:
        condition: service_healthy
